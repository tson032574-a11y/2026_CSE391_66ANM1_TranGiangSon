<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Danh sách sinh viên</title>

<style>

body{
font-family: Arial;
margin:40px;
}

.controls{
margin-bottom:15px;
}

table{
border-collapse: collapse;
width:600px;
}

th,td{
border:1px solid #ccc;
padding:8px;
text-align:center;
}

th{
background:#f2f2f2;
cursor:pointer;
}

.low-score{
background:#f3bf14;
}

.no-result{
color:red;
font-weight:bold;
}

</style>
</head>

<body>

<h2>Danh sách sinh viên</h2>

<div class="controls">

<input id="search" placeholder="Tìm theo tên">

<select id="filter">
<option value="all">Tất cả</option>
<option value="Giỏi">Giỏi</option>
<option value="Khá">Khá</option>
<option value="Trung bình">Trung bình</option>
<option value="Yếu">Yếu</option>
</select>

</div>

<table>

<thead>
<tr>
<th>Họ tên</th>
<th id="scoreHeader">Điểm ▲</th>
<th>Xếp loại</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

<script>

const students = [

{name:"A",score:9},
{name:"B",score:7.5},
{name:"C",score:6},
{name:"D",score:8},
{name:"E",score:4.5}

]

let filteredStudents=[...students]

let sortAsc=true

const searchInput=document.getElementById("search")
const filterSelect=document.getElementById("filter")
const tableBody=document.getElementById("tableBody")
const scoreHeader=document.getElementById("scoreHeader")

function getRank(score){

if(score>=8.5) return "Giỏi"
if(score>=7) return "Khá"
if(score>=5) return "Trung bình"
return "Yếu"

}

function renderTable(){

tableBody.innerHTML=""

if(filteredStudents.length===0){

tableBody.innerHTML=
'<tr><td colspan="3" class="no-result">Không có kết quả</td></tr>'

return

}

filteredStudents.forEach(s=>{

let rank=getRank(s.score)

let rowClass=s.score<5 ? "low-score" : ""

tableBody.innerHTML+=
`<tr class="${rowClass}">
<td>${s.name}</td>
<td>${s.score}</td>
<td>${rank}</td>
</tr>`

})

}

function applyFilters(){

let keyword=searchInput.value.toLowerCase()

let rankFilter=filterSelect.value

filteredStudents=students.filter(s=>{

let matchName=
s.name.toLowerCase().includes(keyword)

let matchRank=
rankFilter==="all" || getRank(s.score)===rankFilter

return matchName && matchRank

})

filteredStudents.sort((a,b)=>{

return sortAsc ? a.score-b.score : b.score-a.score

})

renderTable()

}

searchInput.addEventListener("input",applyFilters)

filterSelect.addEventListener("change",applyFilters)

scoreHeader.addEventListener("click",()=>{

sortAsc=!sortAsc

scoreHeader.textContent=
sortAsc ? "Điểm ▲" : "Điểm ▼"

applyFilters()

})

applyFilters()

</script>

</body>
</html>
