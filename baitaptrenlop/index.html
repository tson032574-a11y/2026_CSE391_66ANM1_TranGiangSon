<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Thực hành JavaScript DOM</title>

<style>
body{font-family:Arial}

.box{
    padding:20px;
    background:#eee;
    margin-top:10px;
}

.active{
    background:rgb(10, 179, 236);
}

.highlight{
    color:red;
    font-weight:bold;
}

.nested{
    padding:20px;
    border:2px solid black;
    margin-top:20px;
}

.child{
    padding:20px;
    border:2px dashed gray;
    margin-top:10px;
}

li{
    cursor:pointer;
}

img{
    width:150px;
    margin-top:10px;
}
</style>

</head>
<body>

<h1 id="title">Tiêu đề ban đầu</h1>

<div id="content" class="box">
    Nội dung ban đầu
</div>

<ul id="studentList">
<li class="student">Nguyễn Văn A</li>
<li class="student">Trần Thị B</li>
</ul>

<img id="avatar" src="https://via.placeholder.com/150">

<br><br>

<button id="btnClick">Click vào tôi</button>

<br><br>

<form id="myForm">
<input type="text" placeholder="Nhập tên..." required>
<button type="submit">Submit</button>
</form>

<div class="nested" id="parentBox">
Parent
<div class="child" id="childBox">
Child
</div>
</div>

<h2>Danh sách công việc</h2>
<ul id="todoList">
<li>Học JavaScript</li>
<li>Làm bài tập DOM</li>
<li>Ôn lại HTML CSS</li>
</ul>

<h2>Dữ liệu từ API</h2>
<div id="userData"></div>

<script>

console.log("===== SELECTING ELEMENTS =====")

const firstStudent = document.querySelector(".student")
console.log(firstStudent)

const allStudents = document.querySelectorAll(".student")
console.log(allStudents)

const title = document.getElementById("title")
console.log(title)



console.log("===== MODIFYING ELEMENTS =====")

title.textContent = "Danh sách sinh viên lớp 66ANM1"

const content = document.getElementById("content")
content.innerHTML += "<p>Được thêm bằng innerHTML</p>"

const newItem = document.createElement("li")
newItem.textContent = "Lê Văn C"

const list = document.getElementById("studentList")
list.appendChild(newItem)

list.querySelector("li").remove()



console.log("===== ATTRIBUTES & CLASSES =====")

const img = document.getElementById("avatar")

img.src = "https://via.placeholder.com/150/ff0000"

content.classList.add("highlight")

setTimeout(()=>{
content.classList.remove("highlight")
},2000)

content.classList.toggle("active")

console.log(content.classList.contains("active"))



console.log("===== EVENT LISTENERS =====")

const btn = document.getElementById("btnClick")

btn.addEventListener("click",()=>{
title.textContent="Bạn vừa click nút!"
})

btn.addEventListener("mouseenter",()=>{
btn.textContent="Chuột đang ở đây"
})

btn.addEventListener("mouseleave",()=>{
btn.textContent="Click vào tôi"
})



console.log("===== EVENTS (BÀI MỚI) =====")

btn.addEventListener("click",()=>{
console.log("Button clicked")
})

document.addEventListener("keydown",(event)=>{
console.log("Phím vừa nhấn:",event.key)
})

const form=document.getElementById("myForm")

form.addEventListener("submit",(e)=>{
e.preventDefault()
console.log("Form submit nhưng không reload")
})

const parent=document.getElementById("parentBox")
const child=document.getElementById("childBox")

parent.addEventListener("click",()=>{
console.log("Parent clicked")
})

child.addEventListener("click",()=>{
console.log("Child clicked")
})

const todoList=document.getElementById("todoList")

todoList.addEventListener("click",(e)=>{
if(e.target.tagName==="LI"){
e.target.style.textDecoration="line-through"
}
})



console.log("===== PROMISES =====")

function fakeFetch(){
return new Promise((resolve,reject)=>{

setTimeout(()=>{
resolve("Lấy dữ liệu thành công")
},2000)

})
}

fakeFetch()
.then(data=>{
console.log(data)
return "Bước xử lý tiếp theo"
})
.then(step2=>{
console.log(step2)
})
.catch(err=>{
console.log(err)
})

function errorPromise(){
return new Promise((resolve,reject)=>{
reject("Có lỗi xảy ra")
})
}

errorPromise()
.catch(err=>{
console.log("Bắt lỗi:",err)
})


function oldStyleCallback(callback){
setTimeout(()=>{
callback("Data từ callback")
},1000)
}

function convertToPromise(){
return new Promise(resolve=>{
oldStyleCallback(resolve)
})
}

convertToPromise().then(data=>{
console.log(data)
})



console.log("===== ASYNC AWAIT & FETCH =====")

async function runAsync(){

try{

const response=await fetch("https://jsonplaceholder.typicode.com/users")

const users=await response.json()

console.log(users)

displayUsers(users)

}catch(err){
console.log("Lỗi kết nối",err)
}

}

runAsync()


function displayUsers(users){

const container=document.getElementById("userData")

users.slice(0,3).forEach(user=>{

const div=document.createElement("div")

div.textContent=user.name+" - "+user.email

container.appendChild(div)

})

}

</script>

</body>
</html>
